<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡卡頌 (Carcassonne) 典藏版</title>
    <style>
        :root {
            --bg-color: #070b14;
            --card-bg: #111a2a;
            --accent: #38bdf8;
            --accent-gold: #fbbf24;
            --border: #202e46;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --tile-size: 100px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* ========================================= */
        /* TWO-ROW COMPACT TOP HEADER                */
        /* ========================================= */
        header.app-header {
            background: linear-gradient(180deg, #152135 0%, #0d1624 100%);
            border-bottom: 1.5px solid var(--border);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.15rem;
            font-weight: 900;
            color: #fef08a;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-tools { display: flex; gap: 6px; flex-shrink: 0; }

        button, select {
            background: #1c2b42; color: #f1f5f9; border: 1px solid var(--border);
            padding: 5px 9px; border-radius: 7px; font-size: 0.78rem; font-weight: 700;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px;
            white-space: nowrap;
        }
        button:active { transform: scale(0.95); }
        button.primary { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
        button.gold-btn { background: linear-gradient(135deg, #d97706, #b45309); border-color: #fbbf24; color: #fff; }

        /* Row 2: Player Status Cards */
        .header-scoreboard-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .player-card {
            background: #090f1a;
            border: 1.5px solid #18253a;
            border-radius: 9px;
            padding: 5px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .player-card.active.red {
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), #090f1a);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
        }
        .player-card.active.blue {
            border-color: #3b82f6;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), #090f1a);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.35);
        }

        .player-badge-icon {
            width: 26px; height: 26px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .player-badge-icon.red { background: linear-gradient(135deg, #ef4444, #991b1b); }
        .player-badge-icon.blue { background: linear-gradient(135deg, #3b82f6, #1e40af); }

        .player-info { flex: 1; min-width: 0; }
        .player-title-line {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.72rem; font-weight: 800;
        }
        .player-title-line.red { color: #fca5a5; }
        .player-title-line.blue { color: #93c5fd; }
        .player-turn-indicator {
            font-size: 0.62rem; background: #f59e0b; color: #000;
            padding: 1px 4px; border-radius: 5px; font-weight: 900;
            animation: pulseTurn 1s infinite alternate;
        }
        @keyframes pulseTurn {
            from { opacity: 0.75; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .player-stats-line {
            display: flex; justify-content: space-between;
            font-size: 0.78rem; font-weight: 700; margin-top: 1px; color: #cbd5e1;
        }
        .score-num { font-size: 0.92rem; font-weight: 900; color: #fff; }

        /* ========================================= */
        /* INFINITE MAP CANVAS                       */
        /* ========================================= */
        #viewport {
            flex: 1;
            position: relative;
            background: #060910;
            background-image: 
                radial-gradient(circle at 50% 50%, #0d1524 0%, #04070d 100%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            overflow: hidden;
            cursor: grab;
        }
        #viewport:active { cursor: grabbing; }

        #world {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
            transition: transform 0.04s linear;
        }

        /* Seamless Tiles */
        .map-tile {
            position: absolute;
            width: 100px; height: 100px;
            /* Seamless connection with neighbor tiles */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .map-tile.just-placed {
            animation: tileDrop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }
        @keyframes tileDrop {
            0% { transform: scale(0.2); opacity: 0; }
            80% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* 3D Wooden Meeples on Map */
        .meeple-on-map {
            position: absolute;
            width: 32px; height: 32px;
            z-index: 15;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.9));
            animation: meepleLand 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        @keyframes meepleLand {
            0% { transform: translate(-50%, -100%) scale(1.6); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Placement Slots (+) */
        .placement-slot {
            position: absolute;
            width: 100px; height: 100px;
            border-radius: 4px;
            border: 2px dashed rgba(245, 158, 11, 0.85);
            background: rgba(245, 158, 11, 0.18);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20;
            animation: pulseSlot 1.4s infinite alternate;
        }
        .placement-slot:hover {
            background: rgba(245, 158, 11, 0.4);
            border-color: #fbbf24;
            transform: scale(1.04);
        }
        .slot-plus { font-size: 2.2rem; color: #fbbf24; font-weight: 900; text-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
        @keyframes pulseSlot {
            0% { transform: scale(0.97); opacity: 0.7; }
            100% { transform: scale(1.02); opacity: 1; box-shadow: 0 0 20px rgba(245, 158, 11, 0.55); }
        }

        /* Meeple Picker Overlay Dialog */
        .meeple-picker-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 500;
            box-shadow: 0 14px 35px rgba(0,0,0,0.85);
            animation: tileDrop 0.25s;
            min-width: 220px;
        }
        .meeple-picker-title { font-size: 0.82rem; font-weight: 800; color: var(--accent-gold); text-align: center; }
        .meeple-btn-group { display: flex; flex-direction: column; gap: 6px; }
        .meeple-choice-btn {
            padding: 7px 12px; font-size: 0.8rem; border-radius: 8px;
            background: #1e293b; border: 1px solid var(--border); color: #fff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .meeple-choice-btn:hover { background: #334155; border-color: var(--accent); }

        /* Floating Score Popups */
        .score-popup {
            position: absolute;
            font-size: 1.45rem; font-weight: 900; color: #fde047;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.9), 0 2px 4px #000;
            z-index: 1000; pointer-events: none;
            animation: floatScore 1.8s forwards cubic-bezier(0.1, 0.9, 0.2, 1);
            white-space: nowrap;
        }
        @keyframes floatScore {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -30px) scale(1.3); opacity: 1; }
            80% { transform: translate(-50%, -70px) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(0.8); opacity: 0; }
        }

        /* Bottom Floating HUD */
        .hud-overlay {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 26, 42, 0.96);
            backdrop-filter: blur(14px);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 8px 14px;
            display: flex; align-items: center; gap: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.75);
            z-index: 100; max-width: 94%;
        }
        .current-tile-preview {
            width: 76px; height: 76px;
            border-radius: 10px; background: #0f172a;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .tile-rotator { width: 100%; height: 100%; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hud-info { display: flex; flex-direction: column; gap: 3px; }
        .hud-title { font-size: 0.9rem; font-weight: 800; color: #fff; }
        .hud-desc { font-size: 0.72rem; color: var(--text-muted); }
        .hud-actions { display: flex; gap: 6px; margin-top: 3px; }

        /* Floating Zoom Controls */
        .zoom-controls {
            position: absolute; right: 14px; bottom: 110px;
            display: flex; flex-direction: column; gap: 6px; z-index: 90;
        }
        .zoom-btn {
            width: 40px; height: 40px;
            background: rgba(24, 36, 56, 0.92);
            border: 1.5px solid var(--border); border-radius: 50%;
            color: #fff; font-size: 1.2rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        }

        /* Modal Gallery of 24 Archetypes */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 16px;
        }
        .modal.hidden { display: none; }
        .modal-card {
            background: #131d2e; border: 1.5px solid var(--border);
            border-radius: 18px; padding: 20px; max-width: 580px; width: 100%;
            max-height: 85vh; display: flex; flex-direction: column; gap: 14px;
        }
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 10px; overflow-y: auto; padding: 4px; max-height: 60vh;
        }
        .gallery-item {
            background: #0b1320; border: 1.5px solid var(--border);
            border-radius: 10px; padding: 8px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; cursor: pointer; transition: all 0.15s;
        }
        .gallery-item:hover { transform: scale(1.08); border-color: var(--accent); background: #1a273d; }
        .gallery-item-name { font-size: 0.68rem; color: var(--text-muted); text-align: center; font-weight: 700; }

        /* Toast */
        #toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0284c7; color: #fff; padding: 8px 18px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 700;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5); z-index: 2000;
            transition: transform 0.3s;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="toast"></div>

<!-- TWO-ROW TOP HEADER -->
<header class="app-header">
    <!-- Row 1: Short Logo & Action Buttons -->
    <div class="header-top-row">
        <div class="logo">
            <span>🏰</span>
            <span>卡卡頌</span>
        </div>
        <div class="header-tools">
            <select id="theme-selector" onchange="changeMapTheme(this.value)" style="padding: 4px 6px;">
                <option value="classic">🎨 典藏桌遊手繪風</option>
                <option value="3d_tactile">🏰 3D 立體浮雕風</option>
                <option value="vibrant">🌲 翠綠莊園風</option>
            </select>
            <button class="gold-btn" onclick="generatePresetKingdom('prosperous')">✨ 範例王國</button>
            <button onclick="toggleGalleryModal()">📚 圖鑑</button>
            <button onclick="resetGame()">🔄 重設</button>
        </div>
    </div>

    <!-- Row 2: Player Scoreboard & Meeples Remaining -->
    <div class="header-scoreboard-row">
        <div id="p1-score-pill" class="player-card active red">
            <div class="player-badge-icon red">
                <svg viewBox="0 0 100 100" width="18" height="18">
                    <path d="M 50 14 C 58 14 62 19 62 26 C 62 31 59 34 55 36 L 72 46 C 76 48 76 53 72 56 L 64 63 L 60 56 L 60 88 L 40 88 L 40 56 L 36 63 L 28 56 C 24 53 24 48 28 46 L 45 36 C 41 34 38 31 38 26 C 38 19 42 14 50 14 Z" fill="#fff" />
                </svg>
            </div>
            <div class="player-info">
                <div class="player-title-line red">
                    <span>紅方領主</span>
                    <span id="p1-turn-tag" class="player-turn-indicator">▶ 行動中</span>
                </div>
                <div class="player-stats-line">
                    <span>得分: <b id="score-red" class="score-num">0</b></span>
                    <span>米波: <b id="meeples-red">7</b>/7</span>
                </div>
            </div>
        </div>

        <div id="p2-score-pill" class="player-card blue">
            <div class="player-badge-icon blue">
                <svg viewBox="0 0 100 100" width="18" height="18">
                    <path d="M 50 14 C 58 14 62 19 62 26 C 62 31 59 34 55 36 L 72 46 C 76 48 76 53 72 56 L 64 63 L 60 56 L 60 88 L 40 88 L 40 56 L 36 63 L 28 56 C 24 53 24 48 28 46 L 45 36 C 41 34 38 31 38 26 C 38 19 42 14 50 14 Z" fill="#fff" />
                </svg>
            </div>
            <div class="player-info">
                <div class="player-title-line blue">
                    <span>藍方領主</span>
                    <span id="p2-turn-tag" class="player-turn-indicator" style="display: none;">▶ 行動中</span>
                </div>
                <div class="player-stats-line">
                    <span>得分: <b id="score-blue" class="score-num">0</b></span>
                    <span>米波: <b id="meeples-blue">7</b>/7</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Infinite Canvas Viewport -->
<div id="viewport">
    <div id="world">
        <!-- Rendered Tiles, Placement Slots, and Meeples injected here -->
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">＋</button>
        <button class="zoom-btn" onclick="zoomOut()">－</button>
        <button class="zoom-btn" onclick="resetView()" style="font-size: 0.85rem;">🎯</button>
    </div>

    <!-- Floating HUD (Draw & Rotate) -->
    <div class="hud-overlay">
        <div class="current-tile-preview">
            <div id="hud-rotator" class="tile-rotator">
                <!-- Current Tile SVG injected here -->
            </div>
        </div>
        <div class="hud-info">
            <div id="hud-tile-name" class="hud-title">古道林地 (Road)</div>
            <div class="hud-desc">
                剩餘牌堆: <b id="deck-count-text">71/72</b> 張 ｜ 點擊地圖黃色 <b>[➕]</b> 拼放
            </div>
            <div class="hud-actions">
                <button class="primary" onclick="rotateCurrentTile()">🔄 旋轉 90°</button>
                <button onclick="drawRandomTile()">🎲 抽新板塊</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal 24 Archetype Gallery -->
<div id="gallery-modal" class="modal hidden" onclick="if(event.target === this) toggleGalleryModal();">
    <div class="modal-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.15rem; font-weight: 800; color: var(--accent-gold);">📜 24 種歐式經典板塊原型圖鑑</h2>
            <button onclick="toggleGalleryModal()">✕ 關閉</button>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-muted);">
            點擊任意板塊即可將其切換為「當前手牌」，在無限地圖上直接拼放！
        </p>
        <div id="gallery-grid" class="gallery-grid">
            <!-- 24 tiles injected here -->
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 🔊 PROCEDURAL SOUND FX (Web Audio API)
    // ==========================================
    class SoundFX {
        constructor() {
            this.ctx = null;
            this.init();
        }
        init() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            } catch (e) {}
        }
        ensure() {
            if (!this.ctx) this.init();
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }
        playSnap() {
            this.ensure();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.09);
        }
        playMeeple() {
            this.ensure();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.12);
        }
        playScore() {
            this.ensure();
            if (!this.ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + i * 0.08);
                osc.stop(this.ctx.currentTime + i * 0.08 + 0.25);
            });
        }
    }
    const audio = new SoundFX();

    // ==========================================
    // 🎨 SEAMLESS, HIGH-AESTHETIC CARCASSONNE SVG
    // ==========================================
    let currentMapTheme = 'classic'; // 'classic' | '3d_tactile' | 'vibrant'

    function changeMapTheme(newTheme) {
        currentMapTheme = newTheme;
        renderWorld();
        audio.playSnap();
        showToast(`🎨 已切換為【${newTheme === 'classic' ? '典藏桌遊手繪風' : newTheme === '3d_tactile' ? '3D 立體浮雕風' : '翠綠莊園風'}】！`);
    }

    const TILE_DEFS = {
        'A': { name: '修道院 (南出路)', edges: ['F','F','R','F'], hasMonastery: true, roadType: 'south' },
        'B': { name: '皇家大修道院', edges: ['F','F','F','F'], hasMonastery: true },
        'C': { name: '四方都城 (金盾)', edges: ['C','C','C','C'], cityType: 'full', shield: true },
        'D': { name: '要塞城牆 + 轉角道', edges: ['C','R','R','F'], cityType: 'north', roadType: 'east-south' },
        'E': { name: '北境孤單城牆', edges: ['C','F','F','F'], cityType: 'north' },
        'F': { name: '貫通雙城要塞(盾)', edges: ['F','C','F','C'], cityType: 'bridge', shield: true },
        'G': { name: '南北雙雄城堡', edges: ['C','F','C','F'], cityType: 'opposite' },
        'H': { name: '雙角獨立堡壘', edges: ['C','C','F','F'], cityType: 'separate-corners' },
        'I': { name: '直角合圍城堡', edges: ['C','C','F','F'], cityType: 'corner' },
        'J': { name: '城牆 + 橫向古道', edges: ['C','R','F','R'], cityType: 'north', roadType: 'straight-h' },
        'K': { name: '城牆 + 轉角古道', edges: ['C','F','R','R'], cityType: 'north', roadType: 'south-west' },
        'L': { name: '城前三岔路口', edges: ['C','R','R','R'], cityType: 'north', roadType: 't-junction' },
        'M': { name: '弧形大城堡', edges: ['C','F','F','C'], cityType: 'corner' },
        'N': { name: '弧形城堡 (皇家盾)', edges: ['C','F','F','C'], cityType: 'corner', shield: true },
        'O': { name: '弧形城 + 轉角古道', edges: ['C','R','R','C'], cityType: 'corner', roadType: 'east-south' },
        'P': { name: '三邊環抱都城', edges: ['C','C','F','C'], cityType: 'three-sides' },
        'Q': { name: '三邊都城 (金盾)', edges: ['C','C','F','C'], cityType: 'three-sides', shield: true },

    // 3D Wooden Meeple
    function renderMeepleSVG(color = 'red') {
        const isRed = color === 'red';
        const gradId = isRed ? 'redMeepleG' : 'blueMeepleG';
        const stroke = isRed ? '#7f1d1d' : '#172554';

        return `
            <svg viewBox="0 0 100 100" width="32" height="32">
                <defs>
                    <radialGradient id="${gradId}" cx="35%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="${isRed ? '#f87171' : '#60a5fa'}" />
                        <stop offset="60%" stop-color="${isRed ? '#dc2626' : '#2563eb'}" />
                        <stop offset="100%" stop-color="${isRed ? '#991b1b' : '#1e3a8a'}" />
                    </radialGradient>
                </defs>
                <path d="M 50 12 C 58 12 64 18 64 26 C 64 31 60 35 56 37 L 74 47 C 78 49 78 54 74 57 L 66 65 L 61 58 L 61 88 L 39 88 L 39 58 L 34 65 L 26 57 C 22 54 22 49 26 47 L 44 37 C 40 35 36 31 36 26 C 36 18 42 12 50 12 Z" 
                      fill="url(#${gradId})" stroke="${stroke}" stroke-width="3" stroke-linejoin="round" />
                <ellipse cx="46" cy="22" rx="4" ry="3" fill="rgba(255,255,255,0.4)" />
            </svg>
        `;
    }

    function getRotatedEdges(typeKey, rotation) {
        const base = TILE_DEFS[typeKey].edges;
        const shift = rotation % 4;
        return [
            base[(4 - shift) % 4],
            base[(5 - shift) % 4],
            base[(6 - shift) % 4],
            base[(7 - shift) % 4]
        ];
    }

    // ==========================================
    // 🗺️ MAP ENGINE & GAME STATE
    // ==========================================
    const TILE_SIZE = 100;
    const gridMap = new Map();
    let currentTile = { typeKey: 'J', rotation: 0 };
    let activePlayer = 'red';
    let scores = { red: 0, blue: 0 };
    let meeplesRemaining = { red: 7, blue: 7 };
    let remainingDeckCount = 71;

    let scale = 0.95;
    let panX = window.innerWidth / 2 - 50;
    let panY = window.innerHeight / 2 - 50;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;

    const viewportEl = document.getElementById('viewport');
    const worldEl = document.getElementById('world');

    function applyTransform() {
        worldEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    viewportEl.addEventListener('mousedown', (e) => {
        if (e.target.closest('.placement-slot') || e.target.closest('.hud-overlay') || e.target.closest('.meeple-picker-overlay')) return;
        isDragging = true;
        dragStartX = e.clientX - panX;
        dragStartY = e.clientY - panY;
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        applyTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    viewportEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            dragStartX = e.touches[0].clientX - panX;
            dragStartY = e.touches[0].clientY - panY;
        }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        panX = e.touches[0].clientX - dragStartX;
        panY = e.touches[0].clientY - dragStartY;
        applyTransform();
    }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });

    viewportEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        scale = Math.min(Math.max(0.35, scale + delta), 2.2);
        applyTransform();
    }, { passive: false });

    function zoomIn() { scale = Math.min(2.2, scale + 0.2); applyTransform(); }
    function zoomOut() { scale = Math.max(0.35, scale - 0.2); applyTransform(); }
    function resetView() {
        scale = 0.95;
        panX = window.innerWidth / 2 - 50;
        panY = window.innerHeight / 2 - 50;
        applyTransform();
    }

    // ==========================================
    // 🧱 PLACEMENT VALIDATION
    // ==========================================
    function checkEdgeMatch(typeKey, rotation, gx, gy) {
        const edges = getRotatedEdges(typeKey, rotation);

        const north = gridMap.get(`${gx},${gy - 1}`);
        if (north) {
            const nEdges = getRotatedEdges(north.typeKey, north.rotation);
            if (edges[0] !== nEdges[2]) return false;
        }

        const east = gridMap.get(`${gx + 1},${gy}`);
        if (east) {
            const eEdges = getRotatedEdges(east.typeKey, east.rotation);
            if (edges[1] !== eEdges[3]) return false;
        }

        const south = gridMap.get(`${gx},${gy + 1}`);
        if (south) {
            const sEdges = getRotatedEdges(south.typeKey, south.rotation);
            if (edges[2] !== sEdges[0]) return false;
        }

        const west = gridMap.get(`${gx - 1},${gy}`);
        if (west) {
            const wEdges = getRotatedEdges(west.typeKey, west.rotation);
            if (edges[3] !== wEdges[1]) return false;
        }

        return true;
    }

    function findValidPlacementSlots() {
        const candidateSlots = new Set();
        const directions = [[0, -1], [1, 0], [0, 1], [-1, 0]];

        for (const [key] of gridMap) {
            const [gx, gy] = key.split(',').map(Number);
            for (const [dx, dy] of directions) {
                const nx = gx + dx;
                const ny = gy + dy;
                if (!gridMap.has(`${nx},${ny}`)) {
                    candidateSlots.add(`${nx},${ny}`);
                }
            }
        }

        const validSlots = [];
        for (const key of candidateSlots) {
            const [gx, gy] = key.split(',').map(Number);
            if (checkEdgeMatch(currentTile.typeKey, currentTile.rotation, gx, gy)) {
                validSlots.push({ gx, gy });
            }
        }
        return validSlots;
    }

    // ==========================================
    // 🏰 BOARD RENDERING & INTERACTION
    // ==========================================
    function renderWorld(justPlacedKey = null) {
        worldEl.innerHTML = '';

        for (const [key, data] of gridMap) {
            const [gx, gy] = key.split(',').map(Number);
            const tileDiv = document.createElement('div');
            tileDiv.className = `map-tile ${key === justPlacedKey ? 'just-placed' : ''}`;
            tileDiv.style.left = `${gx * TILE_SIZE}px`;
            tileDiv.style.top = `${gy * TILE_SIZE}px`;
            tileDiv.innerHTML = renderTileSVG(data.typeKey, data.rotation, TILE_SIZE);
            worldEl.appendChild(tileDiv);

            if (data.meeple) {
                const m = document.createElement('div');
                m.className = 'meeple-on-map';
                m.style.left = `${gx * TILE_SIZE + data.meeple.offsetX}px`;
                m.style.top = `${gy * TILE_SIZE + data.meeple.offsetY}px`;
                m.innerHTML = renderMeepleSVG(data.meeple.color);
                worldEl.appendChild(m);
            }
        }

        const validSlots = findValidPlacementSlots();
        validSlots.forEach(({ gx, gy }) => {
            const slotDiv = document.createElement('div');
            slotDiv.className = 'placement-slot';
            slotDiv.style.left = `${gx * TILE_SIZE}px`;
            slotDiv.style.top = `${gy * TILE_SIZE}px`;
            slotDiv.innerHTML = `<span class="slot-plus">＋</span>`;
            
            slotDiv.addEventListener('click', () => {
                handleTilePlacement(gx, gy);
            });

            worldEl.appendChild(slotDiv);
        });

        updateScoreboard();
        updateHUD();
    }

    function handleTilePlacement(gx, gy) {
        audio.playSnap();

        const placedKey = `${gx},${gy}`;
        const placedTile = {
            typeKey: currentTile.typeKey,
            rotation: currentTile.rotation,
            meeple: null
        };
        gridMap.set(placedKey, placedTile);
        remainingDeckCount = Math.max(0, remainingDeckCount - 1);

        renderWorld(placedKey);

        if (meeplesRemaining[activePlayer] > 0) {
            showMeepleDeployPicker(gx, gy, placedTile);
        } else {
            finishTurnAndCheckScoring(gx, gy);
        }
    }

    function showMeepleDeployPicker(gx, gy, tileData) {
        const picker = document.createElement('div');
        picker.className = 'meeple-picker-overlay';
        picker.style.left = `${gx * TILE_SIZE + 50}px`;
        picker.style.top = `${gy * TILE_SIZE + 50}px`;

        const def = TILE_DEFS[tileData.typeKey];
        let buttonsHtml = '';

        if (def.cityType) {
            buttonsHtml += `<button class="meeple-choice-btn" onclick="deployMeepleAt(${gx}, ${gy}, 'knight', 50, 30)"><span>🏰 派遣騎士 (入駐城堡)</span><span>⚔️</span></button>`;
        }
        if (def.roadType) {
            buttonsHtml += `<button class="meeple-choice-btn" onclick="deployMeepleAt(${gx}, ${gy}, 'robber', 50, 50)"><span>🛣️ 派遣強盜 (巡邏道路)</span><span>🏹</span></button>`;
        }
        if (def.hasMonastery) {
            buttonsHtml += `<button class="meeple-choice-btn" onclick="deployMeepleAt(${gx}, ${gy}, 'monk', 50, 48)"><span>⛪ 派遣修道士 (主持神廟)</span><span>✝️</span></button>`;
        }
        buttonsHtml += `<button class="meeple-choice-btn" onclick="deployMeepleAt(${gx}, ${gy}, null)"><span>⏭️ 保留米波 (不派遣)</span><span>✋</span></button>`;

        picker.innerHTML = `
            <div class="meeple-picker-title">👤 ${activePlayer === 'red' ? '紅方' : '藍方'} 領主：派遣米波跟隨者？</div>
            <div class="meeple-btn-group">${buttonsHtml}</div>
        `;

        worldEl.appendChild(picker);
    }

    window.deployMeepleAt = function(gx, gy, role, ox = 50, oy = 50) {
        const tile = gridMap.get(`${gx},${gy}`);
        if (tile && role) {
            tile.meeple = { color: activePlayer, role, offsetX: ox, offsetY: oy };
            meeplesRemaining[activePlayer]--;
            audio.playMeeple();
            showToast(`👤 ${activePlayer === 'red' ? '紅方' : '藍方'} 派遣了 ${role === 'knight' ? '騎士' : role === 'robber' ? '強盜' : '修道士'}！`);
        }
        document.querySelectorAll('.meeple-picker-overlay').forEach(el => el.remove());
        renderWorld();
        finishTurnAndCheckScoring(gx, gy);
    };

    function finishTurnAndCheckScoring(gx, gy) {
        checkMonasteriesScoring();
        activePlayer = activePlayer === 'red' ? 'blue' : 'red';
        drawRandomTile();
    }

    function checkMonasteriesScoring() {
        for (const [key, data] of gridMap) {
            const def = TILE_DEFS[data.typeKey];
            if (def.hasMonastery && data.meeple && data.meeple.role === 'monk') {
                const [mx, my] = key.split(',').map(Number);
                let surroundingCount = 0;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        if (gridMap.has(`${mx + dx},${my + dy}`)) surroundingCount++;
                    }
                }

                if (surroundingCount === 9) {
                    const scorer = data.meeple.color;
                    scores[scorer] += 9;
                    meeplesRemaining[scorer]++;
                    data.meeple = null;

                    triggerScorePopup(mx, my, `+9 ⛪ 大教堂竣工！`);
                    audio.playScore();
                }
            }
        }
    }

    function triggerScorePopup(gx, gy, text) {
        const pop = document.createElement('div');
        pop.className = 'score-popup';
        pop.style.left = `${gx * TILE_SIZE + 50}px`;
        pop.style.top = `${gy * TILE_SIZE + 50}px`;
        pop.textContent = text;
        worldEl.appendChild(pop);
        setTimeout(() => pop.remove(), 2000);
    }

    function drawRandomTile() {
        const keys = Object.keys(TILE_DEFS);
        currentTile.typeKey = keys[Math.floor(Math.random() * keys.length)];
        currentTile.rotation = 0;
        renderWorld();
    }

    function rotateCurrentTile() {
        currentTile.rotation = (currentTile.rotation + 1) % 4;
        audio.playSnap();
        renderWorld();
    }

    function updateScoreboard() {
        document.getElementById('score-red').textContent = scores.red;
        document.getElementById('score-blue').textContent = scores.blue;
        document.getElementById('meeples-red').textContent = meeplesRemaining.red;
        document.getElementById('meeples-blue').textContent = meeplesRemaining.blue;
        document.getElementById('deck-count-text').textContent = `${remainingDeckCount}/72`;

        const isRed = activePlayer === 'red';
        document.getElementById('p1-score-pill').className = `player-card ${isRed ? 'active' : ''} red`;
        document.getElementById('p2-score-pill').className = `player-card ${!isRed ? 'active' : ''} blue`;

        document.getElementById('p1-turn-tag').style.display = isRed ? 'inline-block' : 'none';
        document.getElementById('p2-turn-tag').style.display = !isRed ? 'inline-block' : 'none';
    }

    function updateHUD() {
        document.getElementById('hud-rotator').innerHTML = renderTileSVG(currentTile.typeKey, currentTile.rotation, 76);
        document.getElementById('hud-tile-name').textContent = TILE_DEFS[currentTile.typeKey].name;
    }

    function resetGame() {
        gridMap.clear();
        scores = { red: 0, blue: 0 };
        meeplesRemaining = { red: 7, blue: 7 };
        remainingDeckCount = 71;
        activePlayer = 'red';

        gridMap.set('0,0', { typeKey: 'J', rotation: 0, meeple: null });
        drawRandomTile();
        resetView();
        showToast('🔄 已重新開局！起始城門板塊置於中心');
    }

    function generatePresetKingdom(theme) {
        gridMap.clear();
        scores = { red: 18, blue: 12 };
        meeplesRemaining = { red: 4, blue: 5 };
        remainingDeckCount = 56;

        const sampleTiles = [
            { gx: 0, gy: 0, type: 'J', rot: 0, meeple: null },
            { gx: 0, gy: -1, type: 'C', rot: 0, meeple: { color: 'red', role: 'knight', offsetX: 50, offsetY: 30 } },
            { gx: 1, gy: 0, type: 'U', rot: 1, meeple: null },
            { gx: 2, gy: 0, type: 'W', rot: 0, meeple: { color: 'blue', role: 'robber', offsetX: 50, offsetY: 50 } },
            { gx: 2, gy: -1, type: 'B', rot: 0, meeple: { color: 'blue', role: 'monk', offsetX: 50, offsetY: 48 } },
            { gx: 2, gy: 1, type: 'V', rot: 0, meeple: null },
            { gx: 1, gy: 1, type: 'V', rot: 1, meeple: null },
            { gx: -1, gy: 0, type: 'V', rot: 2, meeple: null },
            { gx: -1, gy: 1, type: 'U', rot: 0, meeple: null },
            { gx: -1, gy: 2, type: 'A', rot: 2, meeple: { color: 'red', role: 'monk', offsetX: 50, offsetY: 48 } },
            { gx: 3, gy: 0, type: 'E', rot: 3, meeple: null },
            { gx: 0, gy: -2, type: 'I', rot: 1, meeple: null }
        ];

        sampleTiles.forEach(t => {
            gridMap.set(`${t.gx},${t.gy}`, { typeKey: t.type, rotation: t.rot, meeple: t.meeple });
        });

        drawRandomTile();
        resetView();
        audio.playScore();
        showToast('✨ 已載入【繁榮王國】無縫大地圖範例！');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function toggleGalleryModal() {
        const modal = document.getElementById('gallery-modal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            for (const [key, def] of Object.entries(TILE_DEFS)) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    ${renderTileSVG(key, 0, 72)}
                    <div class="gallery-item-name">${def.name}</div>
                `;
                item.addEventListener('click', () => {
                    currentTile.typeKey = key;
                    currentTile.rotation = 0;
                    modal.classList.add('hidden');
                    audio.playSnap();
                    renderWorld();
                });
                grid.appendChild(item);
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        resetGame();
        generatePresetKingdom('prosperous');
    });
</script>
</body>
</html>
